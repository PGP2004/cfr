[train]
train_iters = 100_000_000
iters_per_discount = 10_000
num_threads = 8
omp_chunk_sz = 128
base_seed = 42

[buckets]
flop = "data/clustering/flop_assignments"
turn = "data/clustering/turn_assignments"
river = "data/clustering/river_assignments"

# checkpoint to resume from; enabled = false starts fresh
[load_isets]
enabled = false
regret = "data/runs/prev/regret.bin"
strategy = "data/runs/prev/strat.bin"
offset = "data/runs/prev/offsets.bin"
iters = "data/runs/prev/iters.bin"

# checkpoint to write at end of run
[save_isets]
enabled = true
overwrite = false
regret = "data/runs/current/regret.bin"
strategy = "data/runs/current/strat.bin"
offset = "data/runs/current/offsets.bin"
iters = "data/runs/current/iters.bin"

[save_preflop]
enabled = true
overwrite = false
path = "data/runs/current/preflop.csv"

[bet_sizes]
preflop = [0.5, 1.0]
flop = [0.33, 0.75, 1.5]
turn = [0.75, 1.5]
river = [0.75, 1.25]