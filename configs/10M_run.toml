[train]
train_iters = 10_000_000
iters_per_discount = 10_000
num_threads = 8
omp_chunk_sz = 256
base_seed = 0

# checkpoint to write at end of run
[save_isets]
enabled = true
overwrite = true
regret = "data/runs/10M/regret.bin"
strategy = "data/runs/10M/strat.bin"
offset = "data/runs/10M/offsets.bin"
iters = "data/runs/10M/iters.bin"

[save_preflop]
enabled = true
overwrite = true
path = "data/runs/10M/preflop.csv"